<div class="container-fluid py-4 animate__animated animate__fadeIn" id="seccion-principal-provisiones">
    <!-- Cabecera Limpia (Idéntica a Solicitudes) -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom border-secondary">
        <h2 class="text-white fw-bold mb-0">
            <i class="bi bi-box-seam text-warning me-2"></i> Gestión de Provisiones y Retornos
        </h2>
        <div class="text-muted small">
            Control y seguimiento de insumos, recursos y retornos en tránsito vinculados a relevamientos.
        </div>
    </div>

    <!-- Tarjeta Principal Unificada -->
    <div class="card bg-dark text-light border-secondary shadow-sm p-4 mb-4">
        
        <!-- Barra Superior de Controles (Buscador alineado y selector de paginación) -->
        <div class="row align-items-center g-3 mb-4">
            <div class="col-md-6 col-lg-4">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-dark text-muted border-secondary">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" class="form-control bg-dark text-light border-secondary shadow-sm" id="buscador-provisiones" placeholder="Buscar por código, destino o estado...">
                </div>
            </div>
            
            <div class="col-md-6 col-lg-8 d-flex justify-content-md-end align-items-center gap-2">
                <span class="text-muted small">Mostrar:</span>
                <select class="form-select form-select-sm bg-dark text-light border-secondary w-auto shadow-sm" id="limite-paginacion-provisiones">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                </select>
            </div>
        </div>

        <!-- Tabla de Provisiones -->
        <div class="table-responsive mb-3">
            <table class="table table-dark table-hover align-middle mb-0 border border-secondary" id="tabla-provisiones">
                <thead class="table-secondary text-dark fw-bold small">
                    <tr>
                        <th>ID / Ref.</th>
                        <th>Relevamiento / Ubicación</th>
                        <th>Detalle / Insumos</th>
                        <th>Destino</th>
                        <th>Estado</th>
                        <th>Observaciones</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Se inyecta dinámicamente vía JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Pie de Tabla / Paginación -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center pt-3 border-top border-secondary small text-muted">
            <div id="info-paginacion-provisiones" class="mb-2 mb-md-0">
                Mostrando registros disponibles
            </div>
            <div class="btn-group btn-group-sm" role="group" aria-label="Paginación de provisiones">
                <button type="button" class="btn btn-outline-secondary text-light" id="btn-pagina-anterior">Anterior</button>
                <button type="button" class="btn btn-secondary text-dark fw-bold" disabled id="btn-pagina-actual">Pág. 1 de 1</button>
                <button type="button" class="btn btn-outline-secondary text-light" id="btn-pagina-siguiente">Siguiente</button>
            </div>
        </div>
    </div>
</div>
